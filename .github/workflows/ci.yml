name: CI

# Runs the project's gates on every push to main (bar docs-only ones) and every PR:
#   npm run check   — tsc + eslint + cargo clippy (pedantic, -D warnings)
#   npm run licenses -- --check — the licence inventory matches the dependencies
#   npm run test    — vitest (frontend)
#   npm run test:rust — cargo test (Rust + PDF, via the PDFium wrapper)
#
# Runner: macos-latest (Apple Silicon). Two reasons over the usual
# ubuntu:
#   1. The E2 render golden (tests/fixtures/golden/) was generated on
#      macOS arm64 with the pinned PDFium build. `render_compare` does a
#      tolerance pixel-diff against it; a Linux render would diverge
#      (different PDFium build → anti-aliasing differences — the
#      cross-platform fragility E2's docs call out). macOS keeps the
#      comparison apples-to-apples.
#   2. macOS needs no apt/webkit system-dep install (those are for the
#      Linux WebView), so the job is simpler. It also mirrors the dev
#      environment.
# If Linux CI is wanted later, regenerate the golden on Linux
# (`npm run test:pdf -- --ignored bless_goldens`) or exclude
# render_compare there.
#
# Third-party actions are pinned by commit SHA, not by tag. A tag is a mutable
# pointer: `@v4` re-authorises whatever that repository's owner (or anyone who
# compromises it) has since moved the tag to, on every single run. The trailing
# `# v4.4.0` comment keeps it readable, and Dependabot bumps the SHA and the
# comment together — see .github/dependabot.yml.
#
# `dtolnay/rust-toolchain@stable` is worse than a tag: `stable` is a *branch*,
# so it tracked head continuously. It is pinned to the head at the time of
# pinning; bumping it is a deliberate act.
#
# Trigger is `pull_request`, deliberately never `pull_request_target`. A fork's
# PR runs its own code here, so the job must never hold anything worth stealing:
# no secrets are referenced, and the workflow token is read-only.

# Every push to main and every PR runs everything. Until 2026-10-18 a `gate`
# job ran the heavy jobs on only every third push to main, to save macOS
# minutes; a run whose jobs were all skipped still reported success, which is
# how CI failed every real run from 2026-08-13 to 2026-10-16 unseen. The repo is
# public, and GitHub's standard runners are free for public repositories, so
# the gate was saving nothing.
on:
  push:
    branches: [main]
    # Pure documentation can't change a build or a test result.
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
  # Re-run `main` on demand: `gh workflow run ci.yml --ref main`.
  workflow_dispatch:

# A newer commit cancels the run it supersedes. The event is part of the
# group, so a manual run and a push run of the same commit no longer cancel
# each other (that left "cancelled" checks on commits that had passed).
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  check-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-08
        with:
          # Pinned to match `rust-toolchain.toml`. Left at the default, this
          # installs whatever `stable` is that day — 1.99 by 2026-10-16, whose
          # new clippy lints failed CI on code that passed locally on 1.95.
          toolchain: 1.95.0
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch PDFium
        run: npm run fetch-pdfium

      # The OCR suites need the twelve bundled language packs (~25 MB, each
      # SHA-256-pinned in the script). Like PDFium they are git-ignored, and
      # this job never fetched them, so every OCR test that reads one failed —
      # unseen until 2026-10-17, because earlier failures always stopped the
      # run first.
      - name: Fetch OCR language data
        run: npm run fetch-tessdata

      - name: Check (tsc + eslint + clippy)
        run: npm run check

      # THIRD-PARTY-LICENSES.md and the in-app Licences list are generated from
      # the dependency trees. With nothing checking them they drifted for weeks:
      # the lopdf 0.42 upgrade and P7.C1c's crates went unlisted until P7.C1d
      # regenerated them. --check fails when a dependency change wasn't followed
      # by `npm run licenses`, and when any licence is outside the reviewed-
      # permissive set (docs/01_VISION.md's "no copyleft in the shipped binary").
      - name: Licence inventory up to date
        run: npm run licenses -- --check

      - name: Frontend tests (vitest)
        run: npm run test

      # The P6 redaction fixture is git-ignored and generated on demand. Its
      # generator is stdlib-only and byte-deterministic, so building it here
      # keeps all 17 region- and find-redaction tests running in CI instead of
      # skipping them — redaction is the feature least safe to leave untested.
      # The encrypted fixture is not generated here: its generator needs pypdf,
      # so `decrypt.rs` and `encrypted_open.rs` skip that one with a message.
      - name: Generate acceptance fixtures (stdlib-only)
        run: python3 tests/fixtures/acceptance/generate-p6-document.py

      # P7.C1d: veraPDF, the PDF Association's reference validator, judges the
      # PDF/A output in tests/create_pdfa.rs. A test tool only (GPL-3.0+ OR
      # MPL-2.0), never shipped. Locally those checks skip without it;
      # VIBEPDF_REQUIRE_VERAPDF below makes a missing validator fail here
      # instead of passing quietly.
      - name: Install veraPDF
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install verapdf && verapdf --version

      # --no-fail-fast: cargo otherwise stops at the first failing test binary,
      # and every binary after it goes unreported. That is how several
      # independent failures stacked up here, each hidden behind the last.
      - name: Rust tests (cargo)
        env:
          VIBEPDF_REQUIRE_VERAPDF: "1"
        run: npm run test:rust -- --no-fail-fast

  # Windows is a shipped target (docs/01_VISION) but was never built or tested
  # — FABLE_REVIEW §3.9. This leg compiles ALL Rust on Windows via
  # `cargo clippy --all-targets` (the deepest class of Windows-specific issues:
  # path types, `#[cfg]`, rename semantics at the type level) and runs the
  # frontend suite (which includes the `basename` Windows-path guard from
  # §3.9). It deliberately does NOT run `npm run test:rust`:
  #   - `scripts/fetch-pdfium.sh` has no Windows branch (Darwin/Linux only), and
  #   - the E2 `render_compare` golden is macOS-arm64-specific and would diverge.
  # `check` + the frontend tests need no PDFium binary (pdfium-render binds at
  # runtime, not link time), so no fetch step here. Wiring the Windows Rust PDF
  # suite (fetch-pdfium Windows branch + a per-platform golden skip) is a
  # separate follow-up.
  check-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-08
        with:
          # Pinned to match `rust-toolchain.toml`. Left at the default, this
          # installs whatever `stable` is that day — 1.99 by 2026-10-16, whose
          # new clippy lints failed CI on code that passed locally on 1.95.
          toolchain: 1.95.0
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Check (tsc + eslint + clippy)
        run: npm run check

      - name: Frontend tests (vitest)
        run: npm run test
