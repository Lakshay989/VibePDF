name: CI

# Runs the project's gates on every push to main and every PR:
#   npm run check   — tsc + eslint + cargo clippy (pedantic, -D warnings)
#   npm run test    — vitest (frontend)
#   npm run test:rust — cargo test (Rust + PDF, via the PDFium wrapper)
#
# Runner: macos-latest (Apple Silicon). Two reasons over the usual
# ubuntu:
#   1. The E2 render golden (tests/fixtures/golden/) was generated on
#      macOS arm64 with the pinned PDFium build. `render_compare` does a
#      tolerance pixel-diff against it; a Linux render would diverge
#      (different PDFium build → anti-aliasing differences — the
#      cross-platform fragility E2's docs call out). macOS keeps the
#      comparison apples-to-apples.
#   2. macOS needs no apt/webkit system-dep install (those are for the
#      Linux WebView), so the job is simpler. It also mirrors the dev
#      environment.
# If Linux CI is wanted later, regenerate the golden on Linux
# (`npm run test:pdf -- --ignored bless_goldens`) or exclude
# render_compare there.

on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when a newer commit is pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cost throttle: the heavy job runs on macOS, billed at 10x the Linux rate.
  # Since every gate is also run locally before each push, we don't pay 10x on
  # *every* direct push to main — only every 3rd commit. PRs always run. This
  # gate job is Linux (1x) and finishes in seconds, so the two skipped pushes in
  # each cycle of three cost ~nothing (a skipped `if` job allocates no runner).
  # To go back to every-push, delete this job + the `needs`/`if` below. To change
  # the cadence, edit the `% 3` divisor.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history to count commits
      - id: decide
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT" # always run on PRs
            exit 0
          fi
          n=$(git rev-list --count HEAD)
          if [ $((n % 3)) -eq 0 ]; then run=true; else run=false; fi
          echo "commit #$n on main -> run=$run (heavy CI every 3rd push)"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  check-and-test:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Fetch PDFium
        run: npm run fetch-pdfium

      - name: Check (tsc + eslint + clippy)
        run: npm run check

      - name: Frontend tests (vitest)
        run: npm run test

      - name: Rust tests (cargo)
        run: npm run test:rust

  # Windows is a shipped target (docs/01_VISION) but was never built or tested
  # — FABLE_REVIEW §3.9. This leg compiles ALL Rust on Windows via
  # `cargo clippy --all-targets` (the deepest class of Windows-specific issues:
  # path types, `#[cfg]`, rename semantics at the type level) and runs the
  # frontend suite (which includes the `basename` Windows-path guard from
  # §3.9). It deliberately does NOT run `npm run test:rust`:
  #   - `scripts/fetch-pdfium.sh` has no Windows branch (Darwin/Linux only), and
  #   - the E2 `render_compare` golden is macOS-arm64-specific and would diverge.
  # `check` + the frontend tests need no PDFium binary (pdfium-render binds at
  # runtime, not link time), so no fetch step here. Wiring the Windows Rust PDF
  # suite (fetch-pdfium Windows branch + a per-platform golden skip) is a
  # separate follow-up. Gated by the same throttle as the macOS job.
  check-windows:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Check (tsc + eslint + clippy)
        run: npm run check

      - name: Frontend tests (vitest)
        run: npm run test
