name: E2E

# End-to-end tests run on a SEPARATE Linux job (the main ci.yml is
# macOS, to match the E2 render golden). tauri-driver has no macOS
# support, so E2E can only run on Linux. Kept off every-push (slow:
# builds the app + spins up a webview under xvfb) — PRs and main only.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Same every-3rd-push throttle as ci.yml (see that file's `gate` comment).
  # E2E is Linux (1x) but slow (app build + tauri-driver compile + xvfb), so we
  # only spin it up alongside the heavy CI run. PRs always run.
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          n=$(git rev-list --count HEAD)
          if [ $((n % 3)) -eq 0 ]; then run=true; else run=false; fi
          echo "commit #$n on main -> run=$run (e2e every 3rd push)"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  e2e:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install WebView + WebDriver + display deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            webkit2gtk-driver \
            xvfb

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci # postinstall copies the PDF.js worker into public/

      - name: Fetch PDFium (Linux)
        run: npm run fetch-pdfium

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Build the app (debug, unbundled)
        run: npx tauri build --debug --no-bundle

      - name: Run E2E
        run: |
          export LD_LIBRARY_PATH="$PWD/src-tauri/resources/pdfium:$LD_LIBRARY_PATH"
          xvfb-run -a npm run test:e2e
