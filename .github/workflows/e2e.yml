name: E2E

# End-to-end tests run on a SEPARATE Linux job (the main ci.yml is
# macOS, to match the E2 render golden). tauri-driver has no macOS
# support, so E2E can only run on Linux. Since P7.HF5 the app under test is
# the installed .deb, not the unbundled binary (SPEC: NFR-PKG-001). Runs on
# PRs and on every push to main; until 2026-10-18 it shared ci.yml's
# every-third-push gate, removed for the reasons given there.

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # `gh workflow run e2e.yml --ref main`
  workflow_dispatch:

# As in ci.yml: the event is part of the group, so a manual run and a push run
# of the same commit don't cancel each other.
concurrency:
  group: e2e-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install WebView + WebDriver + display deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            webkit2gtk-driver \
            xvfb

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-08
        with:
          # Pinned to match `rust-toolchain.toml` — see ci.yml for why.
          toolchain: 1.95.0

      - name: Cache cargo build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci # postinstall copies the PDF.js worker into public/

      - name: Fetch PDFium (Linux)
        run: npm run fetch-pdfium

      # The self-check below wants all twelve shipped languages in the package.
      - name: Fetch OCR language data
        run: npm run fetch-tessdata

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      # SPEC: NFR-PKG-001 — test the app the way a user gets it: built into a
      # package, installed, and started with no library path set. Until
      # 2026-11-14 this job ran the unbundled binary with LD_LIBRARY_PATH
      # pointing at the checkout, which is the one arrangement in which the old
      # bare-name PDFium lookup worked.
      - name: Build and package the app (debug .deb)
        run: npx tauri build --debug --bundles deb

      # The file list is printed because a failure below is most likely a file
      # that is not where we expect, and this is the only place that shows it.
      - name: Install the package
        run: |
          deb="$(ls src-tauri/target/debug/bundle/deb/*.deb)"
          echo "package: $deb"
          dpkg-deb -c "$deb" | awk '{print $6}' | grep -v '/$' | grep -v 'licenses/'
          sudo apt-get install -y "./$deb"
          bin="$(dpkg-deb -c "$deb" | awk '{print $6}' | grep -E '(^|\./)usr/bin/[^/]+$' | sed -E 's|^\./||; s|^|/|' | sed -n 1p)"
          test -x "$bin"
          echo "VIBEPDF_BIN=$bin" >> "$GITHUB_ENV"

      # Opens no window, so no xvfb. Fails unless the PDF engine and every
      # shipped OCR language were found inside the installed app.
      - name: Self-check the installed app
        working-directory: ${{ runner.temp }}
        run: |
          "$VIBEPDF_BIN" --self-check

      # wdio.conf.ts starts $VIBEPDF_BIN. No LD_LIBRARY_PATH: the smoke test
      # opens a PDF, which needs PDFium, which the app now has to find itself.
      - name: Run E2E against the installed app
        run: xvfb-run -a npm run test:e2e
