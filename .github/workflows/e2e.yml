name: E2E

# End-to-end tests run on a SEPARATE Linux job (the main ci.yml is
# macOS, to match the E2 render golden). tauri-driver has no macOS
# support, so E2E can only run on Linux. Runs on PRs and on every push to
# main; until 2026-10-18 it shared ci.yml's every-third-push gate, removed for
# the reasons given there.

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  # `gh workflow run e2e.yml --ref main`
  workflow_dispatch:

# As in ci.yml: the event is part of the group, so a manual run and a push run
# of the same commit don't cancel each other.
concurrency:
  group: e2e-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install WebView + WebDriver + display deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            webkit2gtk-driver \
            xvfb

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable branch, 2026-09-08
        with:
          # Pinned to match `rust-toolchain.toml` — see ci.yml for why.
          toolchain: 1.95.0

      - name: Cache cargo build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci # postinstall copies the PDF.js worker into public/

      - name: Fetch PDFium (Linux)
        run: npm run fetch-pdfium

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Build the app (debug, unbundled)
        run: npx tauri build --debug --no-bundle

      - name: Run E2E
        run: |
          export LD_LIBRARY_PATH="$PWD/src-tauri/resources/pdfium:$LD_LIBRARY_PATH"
          xvfb-run -a npm run test:e2e
